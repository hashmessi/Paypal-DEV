# Render Infrastructure as Code (IaC) Blueprint
# Deploys PromiseLoop: PostgreSQL + FastAPI Web Service + Static React Frontend

# DEPLOY-02: the free Postgres expires 30 days after creation (deleted after a 14-day grace).
# Create it no earlier than ~Nov 21 or upgrade the plan before Dec 21 so it outlives judging.
databases:
  - name: promiseloop-db
    databaseName: promiseloop
    user: promiseloop
    plan: free

services:
  # Backend API Service
  - type: web
    name: promiseloop-api
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: promiseloop-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # Frontend Web Client (Static Site on Render Blueprint uses type: web with runtime: static)
  - type: web
    name: promiseloop-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: promiseloop-api
          type: web
          property: host
